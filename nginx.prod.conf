server {
  listen 80;
  root /usr/share/nginx/html;

  # API sob /api, sem o prefixo ao chegar no Express (D-14 da 002; em produção a API se chama leilao-api para não colidir com outros apps da rede do Dokploy).
  location /api/ {
    proxy_pass http://leilao-api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://leilao-api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /images/ {
    proxy_pass http://leilao-api:3000;
    expires 30d;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: rotas do React Router caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}

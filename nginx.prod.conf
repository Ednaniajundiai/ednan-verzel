server {
  listen 80;
  root /usr/share/nginx/html;

  # DNS interno do Docker, consultado a cada pedido (o nome vai numa variável). Com o nome fixo no
  # proxy_pass, o nginx guarda o IP da subida e responde 502 quando a API é recriada com outro IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  # Apelido da API só na rede própria da stack (docker-compose.prod.yml): na dokploy-network o nome
  # `leilao-api` pode ser de outra stack com o mesmo compose.
  set $api ednan-verzel-api:3000;

  # API sob /api, sem o prefixo ao chegar na API. Com variável no proxy_pass, o prefixo sai no rewrite.
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://$api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /socket.io/ {
    proxy_pass http://$api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /images/ {
    proxy_pass http://$api;
    expires 30d;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA: rotas do React Router caem no index.html.
  location / {
    try_files $uri /index.html;
  }
}

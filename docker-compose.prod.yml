# Deploy em VPS com Dokploy (Traefik na frente). Passo a passo em DEPLOY.md.
# Diferenças do docker-compose.yml de avaliação local:
#   - sem Postgres no compose: usa o Postgres criado no Dokploy, pela URL interna (DATABASE_URL);
#   - nenhuma porta publicada no host: o Traefik do Dokploy fala com o serviço `web` pela rede interna;
#   - segredos obrigatórios (sem valor padrão): o deploy falha se faltar algum.
# `dokploy-network` é a rede em que o Dokploy põe o Traefik e os bancos. Os serviços daqui têm nomes
# próprios (leilao-api, leilao-web) porque nessa rede o nome curto `api` pode ser de outro app.
services:
  leilao-api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # URL interna do Postgres do Dokploy (aba Internal Credentials do banco).
      DATABASE_URL: ${DATABASE_URL:?defina DATABASE_URL (URL interna do Postgres do Dokploy)}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      PSEUDONYM_SECRET: ${PSEUDONYM_SECRET:?defina PSEUDONYM_SECRET}
      RECEIPT_SECRET: ${RECEIPT_SECRET:?defina RECEIPT_SECRET}
      # Chave Ed25519 da trilha de auditoria. Vazia: a API gera uma e a guarda no volume `storage`.
      AUDIT_PRIVATE_KEY_PEM: ${AUDIT_PRIVATE_KEY_PEM:-}
      # Testemunha da trilha, fora do banco, no volume persistente.
      WITNESS_FILE: /app/storage/audit-witness.jsonl
      THESPORTSDB_BASE_URL: ${THESPORTSDB_BASE_URL:-https://www.thesportsdb.com/api/v1/json/123}
      CATALOG_TTL_HOURS: ${CATALOG_TTL_HOURS:-24}
      # Sem seed: nenhuma conta nem lote de demonstração. Só a conta do admin (leiloeiro), com o
      # usuário e a senha definidos no ambiente, criada na subida se não existir (a senha não é trocada depois).
      SEED_ON_START: "false"
      ADMIN_USERNAME: ${ADMIN_USERNAME:?defina ADMIN_USERNAME (3 a 32 caracteres, só letras, números, _ e -)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD (mín. 8 caracteres)}
    volumes:
      - storage:/app/storage
    expose:
      - "3000"
    networks:
      - default
      - dokploy-network

  # SPA React em nginx; repassa /api, /socket.io e /images para a API (nginx.prod.conf).
  # No Dokploy, aponte o domínio para este serviço, porta 80.
  leilao-web:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      leilao-api:
        condition: service_healthy
    expose:
      - "80"
    networks:
      - default
      - dokploy-network

volumes:
  storage:

networks:
  dokploy-network:
    external: true

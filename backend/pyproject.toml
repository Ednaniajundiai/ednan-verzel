[project]
name = "casa-de-leiloes-api"
version = "1.0.0"
description = "API de leilão ao vivo de camisas de futebol (specs 001 a 005)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=44",
  "fastapi>=0.115",
  "httpx>=0.28",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "pydantic>=2.10",
  "pyjwt>=2.10",
  "python-socketio>=5.12",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "python-socketio[asyncio-client]>=5.17.0",
  "ruff>=0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
# Os testes compartilham um banco real (Const. 2.3): um arquivo por vez, sem paralelismo.
filterwarnings = ["ignore::jwt.warnings.InsecureKeyLengthWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
files = ["leilao", "scripts"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["socketio", "socketio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["leilao.realtime.socket"]
disallow_untyped_decorators = false
